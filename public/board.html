<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e9ecee">
<title>لوحة طلبات مينيقيش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Lalezar&display=swap">
<style>
/* Layout: sticky control bar, then a kitchen rail of status columns (tabs on phones); each order is a thermal ticket ordered by due time. */
:root{
  --bg:#e9ecee; --surface:#ffffff; --surface-2:#f4f6f7; --ink:#182024; --muted:#5a676e; --line:#d3d9dc;
  --accent:#b8770f; --accent-ink:#7d4f06; --accent-soft:#f6e7cc; --on-accent:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --warn:#9a6410; --warn-soft:#f8eacc; --late:#b8322a; --late-soft:#f8dcd8;
  --wa:#1f7a55; --call:#3f5aa8;
  --shadow:0 1px 0 rgba(24,32,36,.06),0 6px 18px -10px rgba(24,32,36,.25);
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101416; --surface:#1a2023; --surface-2:#151a1d; --ink:#e5e9eb; --muted:#93a0a7; --line:#2b3438;
  --accent:#e2a43c; --accent-ink:#f0c274; --accent-soft:#3a2d16; --on-accent:#1a1205;
  --ok:#5fc48c; --ok-soft:#173226; --warn:#e8b552; --warn-soft:#3a2c12; --late:#f06b5d; --late-soft:#3c1915;
  --wa:#55c895; --call:#8aa2ec; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --surface:#1a2023; --surface-2:#151a1d; --ink:#e5e9eb; --muted:#93a0a7; --line:#2b3438;
  --accent:#e2a43c; --accent-ink:#f0c274; --accent-soft:#3a2d16; --on-accent:#1a1205;
  --ok:#5fc48c; --ok-soft:#173226; --warn:#e8b552; --warn-soft:#3a2c12; --late:#f06b5d; --late-soft:#3c1915;
  --wa:#55c895; --call:#8aa2ec; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:0;margin:0;font-weight:400}
.brand small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:6px}
.clock{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--ink);margin-inline-start:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:500;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pulse{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:600}
.chip.late{background:var(--late-soft);color:var(--late);border-color:transparent}
.chip.drv{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn);margin-top:10px}
.banner[data-kind="info"]{background:var(--surface-2);color:var(--muted)}

/* rail */
.tabs{display:none;gap:6px;overflow-x:auto;padding-block:10px 2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;min-height:38px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .n{font-family:var(--f-mono);margin-inline-start:6px;opacity:.8}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
.col{min-width:0;display:grid;gap:10px;align-content:start}
.colhead{display:flex;align-items:baseline;gap:8px;padding:4px 2px;border-bottom:2px solid var(--ink)}
.colhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
.colhead .n{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.colhead .hint{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:14px 4px;text-align:center;border:1px dashed var(--line);border-radius:8px}
@media (max-width:899px){
  .tabs{display:flex}
  .rail{grid-template-columns:minmax(0,1fr)}
  .col{display:none}
  .col.on{display:grid}
  .colhead{display:none}
  .pulse{margin-inline-start:0}
}

/* ticket */
.tk{background:var(--surface);border-radius:6px 6px 0 0;box-shadow:var(--shadow);position:relative;padding:12px 12px 16px;display:grid;gap:8px;min-width:0}
.tk::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;
  background:radial-gradient(circle at 6px 0,transparent 5px,var(--surface) 5.5px) 0 0/12px 8px repeat-x}
.tk.example{opacity:.9}
.tkhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ink)}
.src{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.src.wa{color:var(--wa)} .src.call{color:var(--call)} .src.shop{color:var(--muted)}
.type{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.type.del{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.due{margin-inline-start:auto;text-align:end;border-radius:8px;padding:4px 8px;background:var(--surface-2)}
.due .t{font-family:var(--f-mono);font-weight:600;font-size:17px;display:block;line-height:1.2;direction:ltr}
.due .left{font-size:12px;font-weight:600;color:var(--muted)}
.due.ok{background:var(--ok-soft)} .due.ok .left{color:var(--ok)}
.due.warn{background:var(--warn-soft)} .due.warn .left{color:var(--warn)}
.due.late{background:var(--late-soft)} .due.late .left{color:var(--late)}
.due.late.over{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{box-shadow:0 0 0 2px var(--late)}}
@media (prefers-reduced-motion:reduce){.due.late.over{animation:none;box-shadow:0 0 0 2px var(--late)}}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.who strong{font-weight:700}
.who .mono{color:var(--muted);font-size:13px}
.area{font-size:13px;color:var(--accent-ink);font-weight:600}
.items{margin:0;padding:8px 0;list-style:none;border-block:1px dashed var(--line);display:grid;gap:3px;font-size:15px}
.items li{display:flex;gap:8px;min-width:0}
.items li span{min-width:0;overflow-wrap:anywhere}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.total{font-family:var(--f-mono);font-weight:600;font-size:15px}
.total small{font-family:var(--f-body);color:var(--muted);font-weight:500}
.acts{margin-inline-start:auto;display:flex;gap:6px}
.go{border:0;border-radius:9px;background:var(--ink);color:var(--bg);font-weight:700;padding:8px 14px;min-height:42px}
.go.done{background:var(--ok);color:var(--surface)}
.sm{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-size:13px;min-height:42px;color:var(--muted)}

/* finished */
.finished{margin-top:28px}
.finished summary{cursor:pointer;font-weight:700;padding:8px 2px;color:var(--muted)}
.flist{display:grid;gap:6px;margin-top:8px}
.frow{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;flex-wrap:wrap}
.frow.cx{opacity:.6;text-decoration:line-through}
.frow .mono{color:var(--muted)}
.frow button{margin-inline-start:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--surface);width:min(720px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.shhead{display:flex;align-items:center;gap:8px}
.shhead .x{margin-inline-start:auto}
.paste{display:grid;gap:6px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px}
.paste label{font-weight:700;font-size:14px}
.paste p{margin:0;font-size:13px;color:var(--muted)}
textarea,input[type=text],input[type=tel],input[type=number],input[type=time]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:44px}
textarea{resize:vertical;min-height:84px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
.f{display:grid;gap:5px;min-width:0}
.f > span{font-size:13px;font-weight:600;color:var(--muted)}
.timeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timeline input{width:auto;flex:1 1 130px}
.parsed{font-size:13px;color:var(--ok);font-weight:600}
.shfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px;border-top:1px solid var(--line)}
.shfoot .btn.primary{flex:1 1 160px}
.danger{color:var(--late);border-color:var(--late)}
.confirm{background:var(--late-soft);color:var(--late);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.err{color:var(--late);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.soundwarn{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--warn);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.latebar{margin-top:10px;padding:12px;border-radius:10px;background:var(--late);color:#fff;font-weight:800;font-size:18px;text-align:center;animation:lateBar 1s steps(2,start) infinite}
@keyframes lateBar{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.latebar{animation:none}}
.latebar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.latebar button{border:2px solid #fff;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.sm.mute{border-color:var(--late);color:var(--late)}
</style>

<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
/* pending web orders strip */
.pending{margin-top:14px;display:grid;gap:10px}
.pending[hidden]{display:none}
.phead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.phead h2{margin:0;font-size:15px;font-weight:700}
.phead p{margin:0;font-size:13px;color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.pc{background:var(--surface);border:2px dashed var(--accent);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.pc.stale{border-color:var(--line);opacity:.75}
.pc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref{font-family:var(--f-mono);font-weight:600;font-size:18px;direction:ltr;letter-spacing:.02em}
.pc .sum{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pc .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pc .row .go{flex:1 1 auto}
.refchip{font-family:var(--f-mono);font-size:12px;color:var(--muted);direction:ltr}
.pc.wa{border-color:var(--wa)}
.rawt{font-size:13px;color:var(--muted)}
.rawt summary{cursor:pointer;font-weight:600}
.rawt div{background:var(--surface-2);border-radius:6px;padding:6px 8px;margin-top:4px;overflow-wrap:anywhere}
/* quick order */
.quick{display:grid;gap:10px}
.qhead{display:flex;align-items:baseline;gap:8px}
.qhead h4{margin:0;font-size:14px;color:var(--muted)}
.qhint{font-size:12px;color:var(--muted);margin-inline-start:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,108px),1fr));gap:8px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px 8px;text-align:start;min-height:72px;display:grid;gap:2px;align-content:start;touch-action:manipulation;user-select:none}
.tile:active{transform:scale(.98)}
.tile .tn{font-weight:700;font-size:14px;line-height:1.3}
.tile .tt{font-size:13px;color:var(--muted)}
.tile .tp{font-family:var(--f-mono);font-size:13px;color:var(--accent-ink);font-weight:600}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile .cnt{position:absolute;top:-8px;inset-inline-end:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--on-accent);font:600 14px var(--f-mono);display:grid;place-items:center;padding:0 6px}
.tile .minus{position:absolute;bottom:6px;inset-inline-end:6px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.cart{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px}
.cline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.cline .q{font:600 14px var(--f-mono);min-width:28px}
.cline .nm{font-weight:600}
.cline .pr{margin-inline-start:auto;font:600 13px var(--f-mono);color:var(--muted)}
.flv{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.flv button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;min-height:30px}
.flv button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flv small{font-size:11px;color:var(--muted);align-self:center}
.slots{display:flex;gap:6px;overflow-x:auto;padding-block:6px 2px;scrollbar-width:thin}
.slots button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:40px;font-weight:600;font-size:14px}
.slots button.asap{font-family:var(--f-body)}
.slots button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;min-height:44px}
.paste summary{cursor:pointer;font-weight:700;font-size:14px}
.paste[open]{display:grid}
.shfoot .sum{flex:1 1 100%;font-size:14px;font-weight:600;min-height:1.2em}
.shfoot .sum b{font-family:var(--f-mono)}
.shfoot .sum .warn{color:var(--warn);font-weight:600}
.src.chefz{color:#fff;background:#6a2fb0;border-color:#6a2fb0} .src.hunger{color:#3a2a00;background:#ffcc00;border-color:#ffcc00}
.src.keeta{color:#2b2200;background:#ffd84d;border-color:#ffd84d} .src.ninja{color:#fff;background:#d6243a;border-color:#d6243a}
#srcSeg{flex-wrap:wrap}
/* ticket state: colored top band and outline */
.tk.st-ok{box-shadow:inset 0 5px 0 var(--ok),var(--shadow)}
.tk.st-warn{box-shadow:inset 0 5px 0 #e8891a,var(--shadow);outline:2px solid #e8891a;outline-offset:-2px}
.tk.st-late{box-shadow:inset 0 5px 0 var(--late),var(--shadow);outline:3px solid var(--late);outline-offset:-3px;animation:latePulse 1s steps(2,start) infinite}
@keyframes latePulse{50%{outline-color:transparent;background:var(--late-soft)}}
.due.warn{background:#fde3c4} .due.warn .left{color:#b55e00}
@media (prefers-reduced-motion:reduce){.tk.st-late{animation:none}}
.startat{font-size:14px;font-weight:600;color:var(--call)}
.startat small{font-weight:500;color:var(--muted)}
.startnow{justify-self:start;font-weight:700;font-size:15px;color:#fff;background:var(--call);border-radius:8px;padding:4px 12px;animation:startPulse 1.2s ease-in-out infinite}
@keyframes startPulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.startnow{animation:none}}
.tile.flash{animation:tileFlash .45s ease-out}
@keyframes tileFlash{0%{background:var(--accent);color:var(--on-accent)}100%{background:var(--accent-soft)}}
.offline{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:var(--late);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;z-index:40}
</style>
</head>
<body>
<div class="offline" id="offline" hidden>انقطع الاتصال — أحاول من جديد</div>
<header class="bar">
  <div class="row1">
    <h1 class="brand">مينيقيش <small>لوحة الطلبات</small></h1>
    <span class="clock" id="clock">--:--</span>
    <button class="btn ghost" id="soundBtn" type="button" aria-pressed="false">التنبيه الصوتي: مطفأ</button>
    <button class="btn primary" id="newBtn" type="button">+ طلب جديد</button>
  </div>
  <div class="row2">
    <div class="seg" role="group" aria-label="اليوم">
      <button type="button" data-day="0" aria-pressed="true">اليوم</button>
      <button type="button" data-day="1" aria-pressed="false">بكرة</button>
    </div>
    <div class="seg" role="group" aria-label="نوع الطلب">
      <button type="button" data-f="all" aria-pressed="true">الكل</button>
      <button type="button" data-f="del" aria-pressed="false">توصيل</button>
      <button type="button" data-f="pick" aria-pressed="false">استلام</button>
    </div>
    <div class="pulse" id="pulse"></div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <button type="button" id="soundWarn" class="soundwarn" hidden>🔇 التنبيه الصوتي مطفأ — اضغط هنا لتشغيله</button>
  <div id="lateBar" class="latebar" role="alert" hidden></div>
</header>

<section class="pending" id="pending" hidden aria-label="طلبات بانتظار تأكيدك">
  <div class="phead"><h2>بانتظار تأكيدك</h2><p>طلبات الموقع تنتقل للمطبخ وحدها عندما تصل رسالة العميل برقم الطلب.</p></div>

  <summary id="finSum">منتهية</summary>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" novalidate>
    <div class="shhead"><h3 id="shTitle">طلب جديد</h3><button type="button" class="btn ghost x" id="closeBtn">إغلاق</button></div>

    <div class="grid">
      <div class="f full"><span>مصدر الطلب</span>
        <div class="seg" id="srcSeg" role="group" aria-label="مصدر الطلب">
          <button type="button" data-v="call" aria-pressed="true">اتصال</button>
          <button type="button" data-v="chefz" aria-pressed="false">ذا شيفز</button>
          <button type="button" data-v="shop" aria-pressed="false">المحل</button>
          <button type="button" data-v="hunger" aria-pressed="false">هنقر</button>
          <button type="button" data-v="keeta" aria-pressed="false">كيتا</button>
          <button type="button" data-v="ninja" aria-pressed="false">نينجا</button>
          <button type="button" data-v="wa" aria-pressed="false">واتساب</button>
        </div></div>

          <button type="button" data-v="1" aria-pressed="false">بكرة</button>

      <div class="sum" id="sumLine"></div>
      <button type="submit" class="btn primary" id="saveBtn">أضف للمطبخ</button>

    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== PARSER START ===== */
function normDigits(s){
  return String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".").replace(/‏|‎/g,"");
}
function parseClock(s){
  s=normDigits(s);
  if(/أقرب|اسرع|أسرع|الحين|حالا|حالًا|الآن|الان|فور/.test(s)) return {asap:true};
  const m=s.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(صباح[اًا]?|مساء[ًا]?|ليل[اًا]?|عصر[اًا]?|ظهر[اًا]?|pm|am|ص|م)?/i);
  if(!m) return null;
  let h=+m[1], mi=+(m[2]||0); const mk=(m[3]||"").toLowerCase();
  if(h>23||mi>59) return null;
  if(!m[2] && !mk && !/الساعة|ساعة/.test(s)) return null;
  if(h<=12){
    if(/^(ص|صباح|am)/.test(mk)){ if(h===12) h=0; }
    else if(/^(م|مساء|pm|عصر|ظهر)/.test(mk)){ if(h<12) h+=12; }
    else if(/^ليل/.test(mk)){ if(h===12) h=0; else if(h>=6) h+=12; }
    else { if(h===12) h=0; else h+=12; } /* بدون علامة: ساعات العمل مسائية، و12 تعني منتصف الليل */
  }
  return {h,m:mi};
}
function parseOrder(text){
  const t=normDigits(text);
  const lines=t.split(/\r?\n+/).map(l=>l.replace(/[*_~`]/g,"").replace(/^[\s\-–•▪️◾️▫️·*]+/,"").trim()).filter(Boolean);
  const r={items:[]};
  const val=l=>{const i=l.search(/[:：]/);return i<0?"":l.slice(i+1).trim();};
  const skip=/(أقرب توصيل|أجر المندوب|مدة التجهيز|المسافة|أرجو|الإجمالي|الاجمالي|المجموع|المطلوب|رسوم|سعر التوصيل|خصم|ضريبة|شكر|مرحب|السلام|طلب جديد|رقم الطلب|https?:\/\/|wa\.me|maps)/;
  let typeHint=null;
  for(const l of lines){
    const key=l.split(/[:：]/)[0];
    if(/^(الاسم|اسم العميل|العميل|الاسم الكريم)/.test(key)){ r.name=val(l); continue; }
    if(/رقم الطلب/.test(key)){ const mm=l.match(/MG-[A-Z0-9]{4,8}/i); if(mm) r.ref=mm[0].toUpperCase(); continue; }
    if(/(الجوال|الهاتف|رقم الجوال|رقم التواصل|التواصل)/.test(key) && val(l)){ continue; }
    if(/^(الحي|العنوان|الموقع|المنطقة|عنوان التوصيل)/.test(key) && val(l) && !/https?:/.test(val(l))){ r.area=val(l); continue; }
    if(/(نوع الطلب|طريقة الاستلام|طريقة الطلب|الاستلام\s*\/\s*التوصيل|التوصيل\s*\/\s*الاستلام|^النوع)/.test(key)){
      const v=val(l); if(/توصيل/.test(v)) typeHint="del"; else if(/استلام|المحل|الفرع/.test(v)) typeHint="pick"; continue; }
    if(/^(اليوم|التاريخ|يوم الاستلام|يوم التوصيل)/.test(key)){
      const v=val(l); if(/غد|بكر/.test(v)) r.day=1; else if(/اليوم/.test(v)) r.day=0;
      else{const dm=v.match(/\b(\d{1,2})\b/);if(dm){const base=new Date(Date.now()-6*3600e3);const tom=new Date(base);tom.setDate(base.getDate()+1);
        if(+dm[1]===base.getDate())r.day=0;else if(+dm[1]===tom.getDate())r.day=1;}}
      continue; }
    if(/(الوقت|وقت|الساعة|موعد)/.test(key) && val(l)){
      const c=parseClock(val(l)); if(c){ if(c.asap) r.asap=true; else r.time=c; } continue; }
    if(/ملاحظ/.test(key)){ r.note=val(l); continue; }
    if(/(الإجمالي|الاجمالي|المجموع|المطلوب|الإجمالي الكلي)/.test(l) && !/قبل/.test(l)){
      const nums=l.match(/\d+(?:\.\d+)?/g); if(nums) r.total=+nums[nums.length-1]; continue; }
    if(skip.test(l)) continue;
    if(/\d/.test(l) || /×|x\s*\d|\d\s*x/i.test(l)){
      let it=l.replace(/\s{2,}/g," ");
      if(it.length<=80) r.items.push(it);
    }
  }
  const ph=t.replace(/[\s\-()]/g,"").match(/(?:\+?966|00966|0)?5\d{8}/);
  if(ph){ r.phone=ph[0].replace(/^(\+?966|00966)/,"0"); if(!/^0/.test(r.phone)) r.phone="0"+r.phone; }
  r.items=r.items.filter(it=>!(r.phone && it.replace(/[\s\-]/g,"").includes(r.phone.slice(1))));
  if(typeHint) r.type=typeHint;
  else if(/استلام|من المحل|من الفرع/.test(t) && !/توصيل\s*[:：]?\s*(نعم|مطلوب)/.test(t)) r.type=/عنوان|الحي/.test(t)?"del":"pick";
  else if(/توصيل/.test(t)) r.type="del";
  if(r.day==null && /بكرة|بكره|غدًا|غدا|الغد/.test(t)) r.day=1;
  if(!r.time && !r.asap){ const m=t.match(/\d{1,2}:\d{2}\s*(?:ص|م|صباحًا|مساءً|صباحا|مساء|pm|am)?/i); if(m){const c=parseClock(m[0]); if(c&&!c.asap) r.time=c;} }
  /* free text: "الساعة 9" / "الساعه ٩ ونص" / "على 10 مساء" */
  if(!r.time && !r.asap){
    const m=t.match(/(?:الساعة|الساعه|ساعة|ساعه|على)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(ونص|و نص|والنص|وربع|و ربع|الا ربع|إلا ربع)?\s*(صباح[اًا]?|مساء[ًا]?|ليل[اًا]?|عصر[اًا]?|ص|م)?/);
    if(m){ const c=parseClock(m[1]+":"+(m[2]||"00")+" "+(m[4]||""));
      if(c&&!c.asap){ let mins=c.h*60+c.m; if(/نص/.test(m[3]||""))mins+=30; else if(/ا ربع|إلا ربع|الا ربع/.test(m[3]||""))mins-=15; else if(/ربع/.test(m[3]||""))mins+=15;
        mins=(mins+1440)%1440; r.time={h:Math.floor(mins/60),m:mins%60}; } }
  }
  if(!r.time && !r.asap && /(الحين|حالا|حالًا|أقرب وقت|اقرب وقت|الآن|الان)/.test(t)) r.asap=true;
  return r;
}
/* ===== PARSER END ===== */

/* ---------- time (Riyadh, UTC+3 all year; operating day starts 06:00) ---------- */
let skew=0; /* server clock minus device clock */
const now=()=>Date.now()+skew;
const RIYADH=3*3600e3, CUT=6*3600e3;
const pad=n=>String(n).padStart(2,"0");
const rParts=ms=>{const d=new Date(ms+RIYADH);return{y:d.getUTCFullYear(),mo:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes()};};
const opDayOf=ms=>new Date(ms+RIYADH-CUT).toISOString().slice(0,10);
function dayKey(offset){return opDayOf(now()+offset*864e5);}
function dueFrom(offset,h,m){
  const k=dayKey(offset); /* operating date */
  let ms=Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),h,m)-RIYADH;
  if(h*60+m<6*60) ms+=864e5;
  return ms;
}
function fmtClock(ms){const p=rParts(ms);const ap=p.h<12?"ص":"م";return ((p.h%12)||12)+":"+pad(p.mi)+" "+ap;}
function minsLeftText(mins){
  if(mins>=60){const h=Math.floor(mins/60),m=mins%60;return "بعد "+h+" س"+(m?" "+m+" د":"");}
  if(mins>0) return "بعد "+mins+" د";
  if(mins===0) return "الآن";
  const a=-mins; return "متأخر "+(a>=60?Math.floor(a/60)+" س "+(a%60)+" د":a+" د");
}

/* ---------- state ---------- */
const COLS=[
  {k:"new",t:"بانتظار التحضير",hint:"حسب وقت البدء"},
  {k:"prep",t:"يُحضَّر"},
  {k:"ready",t:"جاهز"},
  {k:"out",t:"مع المندوب"}];
const NEXT={new:["prep","ابدأ التحضير"],prep:["ready","جاهز"],ready:null,out:["done","وصل للعميل"]};
const PREV={prep:"new",ready:"prep",out:"ready"};
const S={master:true,unlocked:false,dayOff:0,filter:"all",tab:"new",orders:[],sound:false,known:null,alerted:new Set(),ready:false,editing:null};

/* ---------- API ---------- */
async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(r.status===401){location.href="/login";throw new Error("auth");}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||("HTTP "+r.status)),{code:j.error});
  return j;
}
let pollT=null,inflight=false,fails=0;
async function load(){
  if(inflight)return; inflight=true;
  const day=dayKey(S.dayOff);
  try{
    const t0=Date.now(); const j=await api("GET","/api/board/orders?day="+day);
    skew=j.now-Math.round((t0+Date.now())/2);
    if(day!==dayKey(S.dayOff)){inflight=false;return;}
    const ids=new Set(j.orders.map(o=>o.id));
    if(S.known&&S.dayKnown===day){
      const fresh=j.orders.filter(o=>!S.known.has(o.id));
      if(fresh.length){
        const web=fresh.filter(o=>o.status==="pending").length;
        toast(web?"طلب جديد بانتظار تأكيدك":(fresh.length===1?"أُضيف طلب جديد":"أُضيفت "+fresh.length+" طلبات"));
        if(S.sound)announceNew();
      }
    }
    S.known=ids; S.dayKnown=day; S.orders=j.orders; S.ready=true; fails=0;
    if(j.settings&&j.settings.sound!==S.master){S.master=j.settings.sound;syncSound();}
    $("offline").hidden=true; render();
  }catch(e){
    if(e.message!=="auth"){fails++; if(fails>=2)$("offline").hidden=false;}
  }finally{inflight=false;}
}
function startPolling(){clearInterval(pollT);pollT=setInterval(()=>{if(document.visibilityState==="visible")load();},4000);}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){load();if(S.sound)keepAwake();}});

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const visible=o=>S.filter==="all"||o.type===S.filter;
function handoverAt(o){return o.due-travelMin(o)*60000;}
/* a pickup by our own customer that is ready is waiting on the customer, not the kitchen: no late alert */
const awaitsCustomer=o=>o.status==="ready"&&o.type==="pick"&&!isApp(o.source);
const isLate=(o,t)=>["new","prep","ready"].includes(o.status)&&!awaitsCustomer(o)&&handoverAt(o)<t;
function urgency(o,t){
  const h=handoverAt(o);
  const mins=Math.round((h-t)/60000);
  /* until it is handed to the customer or the courier: green with time to spare, orange in the last 5 minutes, red once late */
  let cls="";
  if(awaitsCustomer(o)) cls="ok";
  else if(["new","prep","ready"].includes(o.status)) cls=h<t?"late over":h-t<=5*60000?"warn":"ok";
  return {mins,cls};
}
/* when to start: delivery time minus preparation (and travel for delivery) */
const PREP_MIN=25, COURIER_MIN=10, DEFAULT_TRAVEL_MIN=20;
function travelMin(o){
  if(o.type!=="del"||isApp(o.source))return 0;
  const name=String(o.area||"").replace(/\s*\(.*\)\s*$/,"").trim();
  const a=MENU&&MENU.areas.find(x=>x.name===name);
  const f=(MENU&&MENU.rules&&MENU.rules.timeFactor)||1.4;
  const m=a&&a.minutes!=null?Math.ceil(a.minutes*f):DEFAULT_TRAVEL_MIN;
  return m+COURIER_MIN;
}
function startAt(o){return o.due-(PREP_MIN+travelMin(o))*60000;}
function startPhrase(o){return "ابدأ تحضير الطلب رقم "+o.num+(isApp(o.source)?"، "+SRC[o.source]:o.type==="del"?"، توصيل":"، استلام");}
const SRC={web:"الموقع",wa:"واتساب",call:"اتصال",shop:"المحل",chefz:"ذا شيفز",hunger:"هنقرستيشن",keeta:"كيتا",ninja:"نينجا"};
const APPS=["chefz","hunger","keeta","ninja"]; const isApp=s=>APPS.includes(s);
/* WhatsApp number for wa.me: 05xxxxxxxx -> 9665xxxxxxxx */
function waNumber(o){let d=String(o.waFrom||o.phone||"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g,"");
  if(d.startsWith("00"))d=d.slice(2); if(d.startsWith("05"))d="966"+d.slice(1); else if(/^5\d{8}$/.test(d))d="966"+d; return d.length>=11?d:"";}
const giftable=o=>false; /* return gift switched off by Hassan (2026-11-01); codes already sent are still honoured by the server */
const giftBtn=o=>giftable(o)?`<button type="button" class="sm gift" data-act="gift">${o.giftOut?"🎁 "+esc(o.giftOut)+" (أعد)":"🎁 هدية العودة"}</button>`:"";
function ticket(o,t){
  const u=urgency(o,t);
  const items=(o.items||"").split("\n").map(s=>s.trim()).filter(Boolean);
  let next=NEXT[o.status];
  if(o.status==="ready") next=o.type==="del"?["out","سلّمته للمندوب"]:["done",isApp(o.source)?"استلمه مندوب التطبيق":"استلمه العميل"];
  return `<article class="tk ${u.cls?"st-"+u.cls.split(" ")[0]:""}" data-id="${esc(o.id)}">
    <div class="tkhead">
      <span class="no">#${esc(o.num)}</span>
      <span class="src ${o.source==="web"?"wa":esc(o.source)}">${SRC[o.source]||""}${o.appRef?" "+esc(o.appRef):""}</span>
      <span class="type ${o.type==="del"?"del":""}">${isApp(o.source)?"مندوب التطبيق":o.type==="del"?"توصيل":"استلام"}</span>
      <div class="due ${u.cls}"><span class="t">${fmtClock(o.due)}</span><span class="left">${o.status==="out"?"خرج "+fmtClock(o.outAt||t):(awaitsCustomer(o)?"بانتظار العميل":(travelMin(o)?"يطلع مع المندوب "+fmtClock(handoverAt(o))+" · ":"")+minsLeftText(u.mins))}</span></div>
    </div>
    ${o.status==="new"?(t>=startAt(o)?`<div class="startnow">ابدأ الآن</div>`:`<div class="startat">ابدأ التحضير <span class="num">${fmtClock(startAt(o))}</span>${travelMin(o)?` <small>(توصيل ${travelMin(o)} د)</small>`:""}</div>`):""}
    ${(o.name||o.phone||o.ref)?`<div class="who">${o.name?`<strong>${esc(o.name)}</strong>`:""}${o.phone?`<span class="mono">${esc(o.phone)}</span>`:""}${o.ref?`<span class="refchip">${esc(o.ref)}</span>`:""}</div>`:""}
    ${o.type==="del"&&o.area?`<div class="area">${esc(o.area)}</div>`:""}
    ${items.length?`<ul class="items">${items.map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ul>`:""}
    ${o.note?`<div class="note">${esc(o.note)}</div>`:""}
    <div class="foot">
      ${o.total!=null?`<span class="total">${esc(o.total)} <small>ريال</small></span>`:""}
      <div class="acts">
        ${u.cls.startsWith("late")&&!o.alertMuted?`<button type="button" class="sm mute" data-act="mute">🔕 إيقاف التنبيه</button>`:""}
        <button type="button" class="sm" data-act="edit">تعديل</button>
        ${PREV[o.status]?`<button type="button" class="sm" data-act="back">رجوع</button>`:""}
        ${next?`<button type="button" class="go ${next[0]==="done"?"done":""}" data-act="go" data-to="${next[0]}">${next[1]}</button>`:""}
      </div>
    </div>
  </article>`;
}
function pendingCard(o,t){
  const age=Math.round((t-o.created)/60000);
  const items=(o.items||"").split("\n").filter(Boolean);
  if(o.source==="wa") return `<div class="pc wa" data-id="${esc(o.id)}">
    <div class="top"><span class="src wa">واتساب</span><span class="type ${o.type==="del"?"del":""}">${o.type==="del"?"توصيل":"استلام"}</span>
      <span class="refchip">${esc(o.phone)}</span><span class="refchip">قبل ${age} د</span></div>
    <div><strong>${esc(o.name||"بدون اسم")}</strong>${o.type==="del"&&o.area?` · <span class="area">${esc(o.area)}</span>`:""} · <span class="refchip">${fmtClock(o.due)}</span></div>
    <div class="sum">${esc(items.join(" · "))}${o.total!=null?" — "+esc(o.total)+" ريال":""}</div>
    ${o.note?`<div class="note">${esc(o.note)}</div>`:""}
    ${o.rawText?`<details class="rawt"><summary>نص رسالة العميل</summary><div>${esc(o.rawText).replace(/\n/g,"<br>")}</div></details>`:""}
    <div class="row">
      <button type="button" class="go" data-act="review">راجع وأكّد للمطبخ</button>
      <button type="button" class="sm" data-act="dismiss">ليس طلبًا</button>
    </div>
  </div>`;
  return `<div class="pc ${age>=30?"stale":""}" data-id="${esc(o.id)}">
    <div class="top"><span class="ref">${esc(o.ref)}</span><span class="type ${o.type==="del"?"del":""}">${o.type==="del"?"توصيل":"استلام"}</span>
      <span class="refchip">${fmtClock(o.due)}</span><span class="refchip">قبل ${age} د</span></div>
    <div><strong>${esc(o.name||"بدون اسم")}</strong>${o.type==="del"&&o.area?` · <span class="area">${esc(o.area)}</span>`:""}</div>
    <div class="sum">${esc(items.join(" · "))}${o.total!=null?" — "+esc(o.total)+" ريال":""}</div>
    <div class="row">
      <button type="button" class="go" data-act="confirm">وصلت رسالته — أكّد للمطبخ</button>
      <button type="button" class="sm" data-act="dismiss">ما وصلت</button>
    </div>
  </div>`;
}
function render(){
  const t=now();
  const all=S.orders.filter(visible);
  const pend=all.filter(o=>o.status==="pending").sort((a,b)=>a.created-b.created);
  $("pending").hidden=!pend.length;
  $("plist").innerHTML=pend.map(o=>pendingCard(o,t)).join("");
  const live=all.filter(o=>["new","prep","ready","out"].includes(o.status)).sort((a,b)=>a.due-b.due);
  const by=Object.fromEntries(COLS.map(c=>[c.k,live.filter(o=>o.status===c.k)]));
  by.new.sort((a,b)=>startAt(a)-startAt(b));
  const rail=$("rail");
  if(!S.ready) rail.innerHTML=`<div class="empty" style="grid-column:1/-1">جارٍ تحميل طلبات ${S.dayOff?"بكرة":"اليوم"}…</div>`;
  else rail.innerHTML=COLS.map(c=>`<section class="col ${S.tab===c.k?"on":""}" role="tabpanel" aria-label="${c.t}">
      <div class="colhead"><h2>${c.t}</h2><span class="n">${by[c.k].length}</span>${c.hint?`<span class="hint">${c.hint}</span>`:""}</div>
      ${by[c.k].length?by[c.k].map(o=>ticket(o,t)).join(""):`<div class="empty">${c.k==="new"&&!live.length?"لا توجد طلبات مفتوحة. الواتساب يدخل هنا عندما تكتب للعميل «تم اعتماد طلبك» أو «تم تأكيد الطلب»، والاتصال والمحل من «+ طلب جديد».":"لا شيء هنا"}</div>`}
    </section>`).join("");
  $("tabs").innerHTML=COLS.map(c=>`<button type="button" role="tab" data-tab="${c.k}" aria-selected="${S.tab===c.k}">${c.t}<span class="n">${by[c.k].length}</span></button>`).join("");
  const late=live.filter(o=>isLate(o,t)).length;
  const drv=by.ready.filter(o=>o.type==="del").length;
  const sales=S.orders.filter(o=>["new","prep","ready","out","done"].includes(o.status)).reduce((s,o)=>s+(+o.total||0),0);
  $("pulse").innerHTML=
    (pend.length?`<span class="chip drv">بانتظار تأكيد <b>${pend.length}</b></span>`:"")+
    (late?`<span class="chip late">متأخر <b>${late}</b></span>`:"")+
    (drv?`<span class="chip drv">جاهز للمندوب <b>${drv}</b> · اتصل عليه</span>`:"")+
    `<span class="chip">مفتوحة <b>${live.length}</b></span>`+

    `<span class="chip">مبيعات اليوم <b>${Math.round(sales)}</b> ر</span>`;
  const fin=all.filter(o=>["done","cancelled","dismissed"].includes(o.status)).sort((a,b)=>b.updated-a.updated);
  $("finSum").textContent="منتهية وملغاة ("+fin.length+")";
  const finLabel=o=>o.status==="cancelled"?"ملغي":o.status==="dismissed"?"لم تصل رسالته":(o.type==="del"?"وصل":"استُلم");
  $("flist").innerHTML=fin.length?fin.map(o=>`<div class="frow ${o.status!=="done"?"cx":""}" data-id="${esc(o.id)}">
      <strong class="num">#${esc(o.num)}</strong><span>${esc(o.name||"بدون اسم")}</span><span class="mono">${fmtClock(o.due)}</span>
      <span>${finLabel(o)}</span>${o.total!=null?`<span class="mono">${esc(o.total)} ر</span>`:""}
      ${giftBtn(o)}<button type="button" class="sm" data-act="${o.status==="done"?"back":"restore"}">${o.status==="done"?"رجوع":"استرجاع"}</button></div>`).join(""):`<div class="empty">لا يوجد</div>`;
  /* warning sound: once when an order turns late, then every 2 minutes while any order is still late */
  const lateAll=live.filter(o=>isLate(o,t));
  const lateNow=lateAll.filter(o=>!o.alertMuted);
  let fresh=false; lateNow.forEach(o=>{if(!S.alerted.has(o.id)){S.alerted.add(o.id);fresh=true;}});
  $("lateBar").hidden=!lateNow.length;
  $("lateBar").innerHTML=lateNow.length?`<span>متأخر: ${lateNow.map(o=>"#"+o.num+" ("+Math.round((t-handoverAt(o))/60000)+" د)").join("، ")}</span><button type="button" data-act="muteall">🔕 إيقاف التنبيه</button>`:"";
  if(S.sound&&S.rendered&&lateNow.length&&(fresh||t-(S.lastAlarm||0)>=120000)){S.lastAlarm=t;alarm();}
  by.new.forEach(o=>{if(startAt(o)-t<20*60000)warm(startPhrase(o));});
  /* spoken reminder when it is time to start: once, then every 3 minutes (3 times) until preparation starts */
  S.spoken=S.spoken||{};
  if(S.sound&&S.ready&&S.dayOff===0){
    const due=by.new.filter(o=>t>=startAt(o)&&(!S.spoken[o.id]||(S.spoken[o.id].n<3&&t-S.spoken[o.id].at>=180000)));
    due.slice(0,2).forEach((o,i)=>{S.spoken[o.id]={n:(S.spoken[o.id]?S.spoken[o.id].n:0)+1,at:t};
      setTimeout(()=>say(startPhrase(o)),i*4500);});
  }
  S.rendered=S.ready;
}

/* ---------- actions ---------- */
const findOrder=id=>S.orders.find(o=>o.id===id);
async function patch(o,body,okMsg){
  try{const j=await api("PATCH","/api/board/orders/"+o.id,body);Object.assign(o,j.order);render();if(okMsg)toast(okMsg);}
  catch(e){toast("ما انحفظ التغيير، حاول مرة ثانية");}
}
document.addEventListener("click",e=>{
  if(e.target.closest('[data-act="muteall"]')){muteLate(S.orders.filter(o=>isLate(o,now())).map(o=>o.id));return;}
  const b=e.target.closest("[data-act]");
  if(b){
    const host=b.closest("[data-id]"); const o=host&&findOrder(host.dataset.id); if(!o)return;
    const a=b.dataset.act;
    if(a==="go"){patch(o,{status:b.dataset.to});batchCheck(b.dataset.to);}
    else if(a==="back"){const p=o.status==="done"?(o.type==="del"?"out":"ready"):PREV[o.status];if(p)patch(o,{status:p});}
    else if(a==="restore") patch(o,{status:o.status==="dismissed"?"pending":"new"});
    else if(a==="confirm") patch(o,{status:"new",confirm:true},"أُكّد الطلب #"+o.num+" وانتقل للمطبخ");
    else if(a==="dismiss") patch(o,{status:"dismissed"},"أُخفي الطلب "+(o.ref||""));
    else if(a==="edit"||a==="review") openSheet(o);
    else if(a==="gift") sendGift(o,b);
    else if(a==="mute") muteLate([o.id]);
    return;
  }
  const tab=e.target.closest("[data-tab]"); if(tab){S.tab=tab.dataset.tab;render();return;}
  const dbtn=e.target.closest("[data-day]"); if(dbtn){S.dayOff=+dbtn.dataset.day;document.querySelectorAll("[data-day]").forEach(x=>x.setAttribute("aria-pressed",x===dbtn));S.ready=false;S.known=null;render();load();return;}
  const f=e.target.closest("[data-f]"); if(f){S.filter=f.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===f));render();}
});

/* the timing analysis needs each button pressed when it happens: gently flag several presses in one minute */
const presses=[]; let batchWarnAt=0;
function batchCheck(to){
  if(!["prep","ready","out","done"].includes(to))return;
  const t=Date.now(); presses.push({to,t}); while(presses.length&&t-presses[0].t>60000)presses.shift();
  if(presses.filter(x=>x.to===to).length>=3&&t-batchWarnAt>30*60000){batchWarnAt=t;
    setTimeout(()=>toast("انتبه: ٣ طلبات انضغطت بنفس الدقيقة. اضغط الزر وقت ما يصير كل طلب، عشان تحليل التأخير يطلع صح"),2900);}
}
/* "لديك طلب جديد": a recorded clip if one is installed (public/sounds/new-order.mp3), otherwise the device voice */
const newOrderClip=new Audio("/sounds/new-order.mp3"); let clipOk=true;
newOrderClip.addEventListener("error",()=>{clipOk=false;});
function announceNew(){
  beep(1);
  setTimeout(()=>{
    if(clipOk){newOrderClip.currentTime=0;newOrderClip.play().catch(()=>sayDevice("لديك طلب جديد"));}
    else sayDevice("لديك طلب جديد");
  },400);
}
function sayDevice(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
async function muteLate(ids){
  ids.forEach(id=>{const o=findOrder(id);if(o)o.alertMuted=true;}); render();
  try{await Promise.all(ids.map(id=>api("PATCH","/api/board/orders/"+id,{muteAlert:true})));toast("انوقف تنبيه التأخير على كل الأجهزة");}
  catch(e){toast("ما انحفظ الإيقاف، حاول مرة ثانية");load();}
}
async function sendGift(o,b){
  b.disabled=true;

/* cart: lines of {pid,name,tag,price,qty,flavor} */
let cart=[];
const lineKey=(pid,tag)=>pid+"|"+tag;
function countOf(pid,tag){return cart.filter(l=>lineKey(l.pid,l.tag)===lineKey(pid,tag)).reduce((s,l)=>s+l.qty,0);}
function addItem(p,v){
  let l=cart.filter(x=>x.pid===p.id&&x.tag===v.tag&&!x.flavor).pop();
  if(l)l.qty++;else cart.push({pid:p.id,name:p.name,tag:v.tag,price:v.price,qty:1,flavor:""});
  renderTiles();renderCart();
}
function removeItem(pid,tag){
  for(let i=cart.length-1;i>=0;i--){const l=cart[i];if(l.pid===pid&&l.tag===tag){l.qty--;if(l.qty<=0)cart.splice(i,1);break;}}
  renderTiles();renderCart();
}
function setFlavor(i,f){
  const l=cart[i]; if(!l)return;
  if(l.flavor===f){l.flavor="";}
  else if(l.qty>1&&!l.flavor){l.qty--;const same=cart.find(x=>x.pid===l.pid&&x.tag===l.tag&&x.flavor===f);if(same)same.qty++;else cart.splice(i+1,0,{...l,qty:1,flavor:f});}
  else{const same=cart.find((x,j)=>j!==i&&x.pid===l.pid&&x.tag===l.tag&&x.flavor===f);if(same){same.qty+=l.qty;cart.splice(i,1);}else l.flavor=f;}
  renderCart();
}
function renderTiles(){
  const box=$("tiles"); if(!MENU)return;
  if(!MENU.products.length){box.innerHTML=`<div class="empty">ما قدرت أحمّل المنيو. استخدم لصق الرسالة أو وضع النص.</div>`;return;}
  box.innerHTML=MENU.products.flatMap(p=>p.variants.map(v=>{const c=countOf(p.id,v.tag);
    return `<div class="tile ${c?"on":""}" role="button" tabindex="0" data-pid="${esc(p.id)}" data-tag="${esc(v.tag)}" aria-label="${esc(p.name+" "+v.tag)}">
      <span class="tn">${esc(p.name)}</span><span class="tt">${esc(v.tag)}</span><span class="tp">${v.price} ر</span>
      ${c?`<span class="cnt">${c}</span><button type="button" class="minus" data-minus="1" aria-label="إنقاص">−</button>`:""}</div>`;})).join("");
}
let lastBlur=0;
$("sheet").addEventListener("focusout",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))lastBlur=Date.now();});
try{window.visualViewport&&visualViewport.addEventListener("resize",()=>{lastBlur=Date.now();});}catch(e){}

function renderCart(){
  const box=$("cart");
  box.hidden=!cart.length;
  box.innerHTML=cart.map((l,i)=>{const p=MENU&&MENU.products.find(x=>x.id===l.pid);const fl=(p&&p.flavors)||[];
    return `<div class="cline"><span class="q">${l.qty} ×</span><span class="nm">${esc(l.name)} ${esc(l.tag)}${l.flavor?" ("+esc(l.flavor)+")":""}</span>${isApp(segVal("srcSeg"))?"":`<span class="pr">${l.price*l.qty} ر</span>`}
      ${fl.length?`<div class="flv">${fl.map(f=>`<button type="button" data-fi="${i}" data-flv="${esc(f)}" aria-pressed="${l.flavor===f}">${esc(f)}</button>`).join("")}${l.qty>1&&!l.flavor?`<small>اضغط الحشوة لكل بوكس</small>`:""}</div>`:""}</div>`;}).join("");

/* time slots every 30 minutes, like the website */
let pickedSlot=null;
function renderSlots(){
  const box=$("slots"); const off=+segVal("daySeg"); const del=segVal("typeSeg")==="del";
  const t=now(); const k=dayKey(off);
  const base=Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))-RIYADH; /* 00:00 of the operating date */
  const open=base+15.5*3600e3, close=base+24.5*3600e3; /* 3:30 م to 12:30 ص */
  const lead=(del?45:20)*60000;
  let s=off===0?Math.max(open,Math.ceil((t+lead)/1800000)*1800000):open;
  const out=[];
  if(off===0&&t<close-lead)out.push({asap:true,ms:Math.max(t+(del?45:30)*60000,open)});
  for(;s<=close;s+=1800000)out.push({ms:s});
  box.innerHTML=out.length?out.map(o=>`<button type="button" class="${o.asap?"asap":""}" data-ms="${o.ms}" aria-pressed="${pickedSlot&&pickedSlot.asap===!!o.asap&&(o.asap||pickedSlot.ms===o.ms)}">${o.asap?"أقرب وقت":(()=>{const c=fmtClock(o.ms);return `<span class="num">${c.slice(0,-2)}</span> ${c.slice(-1)}`;})()}</button>`).join(""):`<span class="qhint">انتهت أوقات اليوم، اختر بكرة.</span>`;
}
$("slots").addEventListener("click",e=>{const b=e.target.closest("button[data-ms]");if(!b)return;
  pickedSlot={ms:+b.dataset.ms,asap:b.classList.contains("asap")};const p=rParts(pickedSlot.ms);$("dueTime").value=pad(p.h)+":"+pad(p.mi);renderSlots();});
$("dueTime").addEventListener("input",()=>{pickedSlot=null;renderSlots();});

/* totals and delivery minimums from the website rules */
function subtotal(){return cart.reduce((s,l)=>s+l.price*l.qty,0);}
function minFor(fee){const r=(MENU&&MENU.rules)||{};if(fee>=(r.farMinFee||15))return r.farMinSubtotal||0;if(fee>=(r.midMinFee||10))return r.midMinSubtotal||0;return r.minSubtotal||0;}
function renderSum(){
  const el=$("sumLine"); if(textMode()){el.textContent="";return;}
  const sub=subtotal(); const del=segVal("typeSeg")==="del"; const fee=del?areaFee():0; const n=cart.reduce((s,l)=>s+l.qty,0);
  if(!n){el.innerHTML=`<span class="qhint">اضغط على الأصناف لإضافتها</span>`;return;}
  if(isApp(segVal("srcSeg"))){el.innerHTML=`${n} بوكس · ${SRC[segVal("srcSeg")]}${$("appRef").value?" #"+esc($("appRef").value):""}`;return;}
  let w=""; if(del&&$("areaSel").value&&$("areaSel").value!=="__other"){const mn=minFor(fee);if(mn&&sub<mn)w=` · <span class="warn">أقل من حد التوصيل ${mn} ر</span>`;}
  el.innerHTML=`${n} بوكس · <b>${sub+fee}</b> ريال${del&&fee?` (منها توصيل ${fee})`:""}${w}`;
}
function textMode(){return !$("textMode").hidden;}
function setTextMode(on){$("textMode").hidden=!on;$("quick").hidden=on;renderSum();}

function openSheet(o){

  $("saveBtn").textContent=o?(o.status==="pending"?"تأكيد وإرسال للمطبخ":"حفظ التعديل"):"أضف للمطبخ";

  $("items").value=o?o.items||"":""; $("total").value=o&&o.total!=null?o.total:""; $("note").value=o?o.note||"":"";
  S.editBase=o?{items:o.items||"",total:o.total,updated:o.updated,touched:false}:null;

}
/* edit: removing or changing a priced line ("— 35 ريال") moves the total by the same amount, unless the total was typed by hand */
const linesSum=t=>String(t||"").split("\n").reduce((s,l)=>{const m=l.match(/—\s*([\d.]+)\s*ريال/);return s+(m?+m[1]:0);},0);
$("items").addEventListener("input",()=>{const b=S.editBase;if(!b||b.touched||b.total==null)return;
  $("total").value=Math.max(0,Math.round((b.total-linesSum(b.items)+linesSum($("items").value))*100)/100);});
$("total").addEventListener("input",()=>{if(S.editBase)S.editBase.touched=true;});
function closeSheet(){$("scrim").hidden=true;S.editing=null;}
$("newBtn").onclick=()=>openSheet(null);
$("closeBtn").onclick=closeSheet;
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet();});
function setAsap(){const p=rParts(now()+30*60000);setSeg("daySeg",0);$("dueTime").value=pad(p.h)+":"+pad(p.mi);pickedSlot=null;renderSlots();}

$("sheet").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("formErr"); err.hidden=true;
  const tm=$("dueTime").value; const del=segVal("typeSeg")==="del";
  let items, total, deliveryFee=null;
  if(textMode()){
    items=$("items").value.trim(); total=$("total").value===""?null:+$("total").value;
  }else{
    const app=isApp(segVal("srcSeg"));
    items=cart.map(l=>`${l.qty} × ${l.name} ${l.tag}${l.flavor?" ("+l.flavor+")":""}${app?"":` — ${l.price*l.qty} ريال`}`).join("\n");
    deliveryFee=del&&!app?areaFee():null; total=cart.length&&!app?subtotal()+(deliveryFee||0):null;
  }
  if(!items){err.textContent=textMode()?"اكتب صنفًا واحدًا على الأقل.":"اضغط على صنف واحد على الأقل.";err.hidden=false;return;}
  if(!tm){err.textContent="اختر وقت التسليم.";err.hidden=false;$("slots").scrollIntoView({block:"nearest"});return;}
  if(del&&!areaName()){err.textContent="اختر حي التوصيل.";err.hidden=false;return;}
  const [h,mi]=tm.split(":").map(Number); const off=+segVal("daySeg");
  const due=pickedSlot?pickedSlot.ms:dueFrom(off,h,mi);
  const area=del?areaName()+(deliveryFee?` (توصيل ${deliveryFee} ر)`:""):"";
  const data={type:segVal("typeSeg"),name:$("name").value.trim(),phone:normDigits($("phone").value).trim(),area,items,total,note:$("note").value.trim(),due};
  if(deliveryFee!=null)data.deliveryFee=deliveryFee;
  if(isApp(segVal("srcSeg"))){data.appRef=normDigits($("appRef").value).trim();data.type="pick";data.area="";}
  const btn=$("saveBtn"); btn.disabled=true;
  try{
    if(S.editing){
      const o=S.editing;
      /* the order changed (e.g. a new WhatsApp approval) while this form was open: reload it instead of overwriting */
      const fresh=findOrder(o.id);
      if(fresh&&S.editBase&&fresh.updated>S.editBase.updated){openSheet(fresh);$("formErr").textContent="تغيّر الطلب #"+o.num+" وأنت تعدّل (وصل تعديل من الواتساب). هذي النسخة الجديدة، راجعها واحفظ.";$("formErr").hidden=false;btn.disabled=false;return;}
      if(o.source!=="web")data.source=segVal("srcSeg");
      delete data.deliveryFee;
      if(opDayOf(due)!==o.opDay){err.textContent="نقل الطلب ليوم آخر غير متاح من التعديل. ألغِه وأضفه من جديد.";err.hidden=false;btn.disabled=false;return;}
      if(o.status==="pending"){data.status="new";data.confirm=true;}
      await patch(o,data,o.status==="pending"?"أُكّد الطلب #"+o.num+" وانتقل للمطبخ":"انحفظ تعديل الطلب #"+o.num); closeSheet();
    }else{
      data.source=segVal("srcSeg");
      const j=await api("POST","/api/board/orders",data);
      const sameDay=j.order.opDay===dayKey(S.dayOff);
      if(sameDay){S.orders.push(j.order);if(S.known)S.known.add(j.order.id);render();}
      toast("أُضيف الطلب #"+j.order.num+(sameDay?"":" إلى لوحة "+(off?"بكرة":"اليوم")));
      closeSheet();
    }
  }catch(ex){err.textContent="ما انحفظ الطلب ("+(ex.code||ex.message)+"). تأكد من الاتصال وحاول مرة ثانية.";err.hidden=false;}
  btn.disabled=false;
});
$("cancelOrderBtn").onclick=()=>{$("delText").textContent="إلغاء الطلب #"+S.editing.num+"؟ يبقى في قائمة الملغاة ويمكن استرجاعه.";$("delConfirm").hidden=false;};
$("delNo").onclick=()=>{$("delConfirm").hidden=true;};
$("delYes").onclick=async()=>{const o=S.editing;if(!o)return;closeSheet();await patch(o,{status:"cancelled"},"أُلغي الطلب #"+o.num);};

/* ---------- sound, wake lock, misc ---------- */
let actx=null;
function ac(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")try{actx.resume();}catch(e){}return actx;}
function beep(n){
  try{ac();
    for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=880;
      const t=actx.currentTime+i*0.35;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.3);}
  }catch(e){}
}
/* bell: struck-bell timbre (inharmonic partials, long ring), rung twice = "start preparing" */
function bell(n){
  try{ac();
    for(let i=0;i<n;i++){const t=actx.currentTime+i*0.75;
      [[1,0.5,1.8],[2.76,0.22,1.1],[5.4,0.12,0.6],[8.9,0.05,0.3]].forEach(([m,v,d])=>{
        const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=1320*m/2.76;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.05);});}
  }catch(e){}
}
async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")await navigator.wakeLock.request("screen");}catch(e){}}
/* the sound switch is shared: turning it off or on here does it on every device.
   Each device still needs one tap after opening, because browsers block sound until the page is touched. */
function syncSound(){
  S.sound=S.master&&S.unlocked;
  $("soundBtn").setAttribute("aria-pressed",S.master);
  $("soundBtn").textContent="التنبيه الصوتي (كل الأجهزة): "+(S.master?"شغّال":"مطفأ");
  const w=$("soundWarn");
  w.hidden=S.master&&S.unlocked;
  w.textContent=!S.master?"🔇 التنبيه الصوتي مطفأ على كل الأجهزة — اضغط هنا لتشغيله":"🔇 الصوت ما اشتغل على هذا الجهاز — اضغط هنا";
}
function unlock(){if(!S.unlocked){S.unlocked=true;try{ac();}catch(e){}syncSound();if(S.master){keepAwake();bell(2);}}}
async function setMaster(on){
  S.master=on; unlock(); syncSound();
  try{await api("POST","/api/board/settings",{sound:on});toast(on?"شغّلت التنبيه على كل الأجهزة":"طفّيت التنبيه على كل الأجهزة");}
  catch(e){toast("ما انحفظ، حاول مرة ثانية");load();}
}
$("soundBtn").onclick=()=>setMaster(!S.master);
/* browsers allow sound only after a tap: if the sound was on last time, the first tap anywhere turns it back on */
document.addEventListener("pointerdown",e=>{if(e.target.id!=="soundBtn"&&e.target.id!=="soundWarn")unlock();},true);
let toastT=null;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,Math.max(2800,m.length*70));}
function tick(){$("clock").textContent=fmtClock(now());}
setInterval(()=>{tick();if(S.ready)render();},15000);tick();
let arVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar[-_]SA/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
/* Saudi voice from the server (ElevenLabs, cached); falls back to the device voice */
const ttsAudio=new Audio(); let ttsOk=true;
function say(text){
  bell(3);
  if(!ttsOk)return;
  setTimeout(()=>{ttsAudio.src="/api/board/say?t="+encodeURIComponent(text);ttsAudio.play().catch(()=>{});},2300);
}
ttsAudio.addEventListener("error",()=>{fetch(ttsAudio.src).then(r=>{if(r.status===503)ttsOk=false;}).catch(()=>{});});
/* prepare the phrase in advance so it plays instantly when due */
const warmed=new Set();
function warm(text){if(!ttsOk||warmed.has(text))return;warmed.add(text);fetch("/api/board/say?t="+encodeURIComponent(text)).then(r=>{if(r.status===503)ttsOk=false;}).catch(()=>{});}
function alarm(){ /* falling two-tone warning, distinct from the new-order beep */
  try{ac();
    for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.type="sawtooth";
      const t0=actx.currentTime+i*0.5;o.frequency.setValueAtTime(1046,t0);o.frequency.linearRampToValueAtTime(622,t0+0.4);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.45);
      o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+0.5);}
  }catch(e){}
}
/* every tap also wakes the audio; keep the screen awake while the sound is on */
document.addEventListener("pointerdown",()=>{if(actx&&actx.state!=="running")try{actx.resume();}catch(e){}},true);
setInterval(()=>{if(S.sound&&document.visibilityState==="visible")keepAwake();},60000);
$("soundWarn").onclick=()=>{if(!S.master)setMaster(true);else unlock();};
syncSound();
render(); load(); startPolling(); loadMenu();
</script>

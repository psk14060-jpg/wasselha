<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>مينيقيش · لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Lalezar&display=swap">
<style>
:root{
  --bg:#e9ecee; --surface:#fff; --surface-2:#f4f6f7; --ink:#182024; --muted:#5a676e; --line:#d3d9dc;
  --accent:#b8770f; --accent-ink:#7d4f06; --accent-soft:#f6e7cc;
  --good:#2c7a4b; --good-soft:#dcefe3; --bad:#b8322a; --bad-soft:#f8dcd8; --part:#9a6410; --part-soft:#f8eacc;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif; --f-display:"Lalezar","IBM Plex Sans Arabic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101416; --surface:#1a2023; --surface-2:#151a1d; --ink:#e5e9eb; --muted:#93a0a7; --line:#2b3438;
  --accent:#e2a43c; --accent-ink:#f0c274; --accent-soft:#3a2d16;
  --good:#5fc48c; --good-soft:#173226; --bad:#f06b5d; --bad-soft:#3c1915; --part:#e8b552; --part-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --surface:#1a2023; --surface-2:#151a1d; --ink:#e5e9eb; --muted:#93a0a7; --line:#2b3438;
  --accent:#e2a43c; --accent-ink:#f0c274; --accent-soft:#3a2d16;
  --good:#5fc48c; --good-soft:#173226; --bad:#f06b5d; --bad-soft:#3c1915; --part:#e8b552; --part-soft:#3a2c12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:16px max(16px,env(safe-area-inset-left)) 48px}
main{max-width:1100px;margin:0 auto;display:grid;gap:16px}
main>*{min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:400;margin:0;color:var(--accent-ink)}
.brand .logo{height:46px;width:auto;display:block;background:#fff;border-radius:9px;padding:3px 6px}
header{align-items:center!important}
header .sub{color:var(--muted)}
header .upd{margin-inline-start:auto;color:var(--muted);font-size:13px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:17px;margin:0 0 4px}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media (max-width:480px){.card .v{font-size:20px}.card .row{flex-wrap:wrap}}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.card .k{color:var(--muted);font-size:13px}
.card .v{font-family:var(--f-mono);font-weight:600;font-size:24px;direction:ltr;text-align:right}
.card .row{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px;color:var(--muted)}
.chg{font-family:var(--f-mono);font-weight:600;font-size:13px;direction:ltr;padding:1px 7px;border-radius:7px;white-space:nowrap}
.chg.good{color:var(--good);background:var(--good-soft)} .chg.bad{color:var(--bad);background:var(--bad-soft)} .chg.flat{color:var(--muted);background:transparent}
.group{margin-top:14px}
.group h3{font-size:14px;color:var(--muted);margin:0 0 8px;font-weight:500}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface)}
td.n{font-family:var(--f-mono);direction:ltr;text-align:left}
tr.part td{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--part-soft);color:var(--part)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;padding:16px}
.gate form{display:grid;gap:12px;width:min(380px,100%)}
.gate input{font:inherit;font-family:var(--f-mono);font-size:24px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.3em}
.gate button{font:inherit;padding:11px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700}
.gate .err{color:var(--bad);min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gf">
    <img src="{{LOGO}}" alt="مينيقيش" style="height:96px;width:auto;justify-self:center;background:#fff;border-radius:12px;padding:6px 10px">
    <label for="code">رمز الإدارة</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off">
    <button>دخول</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<main id="main" hidden>
  <header><h1 class="brand"><img class="logo" src="{{LOGO}}" alt="مينيقيش"></h1><span class="sub">لوحة الإدارة</span><span class="upd" id="upd"></span></header>

  <section>
    <h2>بطاقة الأسبوع</h2>
    <p class="note" id="cmpNote"></p>
    <div id="groups"></div>
  </section>

  <section>
    <h2>كل الأسابيع</h2>
    <p class="note">الأسبوع من الأحد إلى نهاية دوام السبت. المبيعات = القنوات المباشرة بعد المرتجع، بدون التوصيل وذا شفز، شاملة الضريبة. متوسط الطلب = المبيعات ÷ الطلبات المسعّرة.</p>
    <div class="tw"><table id="weeks"></table></div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = "mg_admin_code";
let code = ""; try { code = sessionStorage.getItem(KEY) || ""; } catch {}
const f0 = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const f1 = n => n == null ? "—" : Number(n).toFixed(1);
const pc = n => n == null ? "—" : Math.round(n * 100) + "%";
const dmy = d => d.slice(8,10) + "/" + d.slice(5,7);
const rng = (a, b) => `<span class="num">${dmy(a)}</span> إلى <span class="num">${dmy(b)}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

// [label, getter, format, direction: +1 higher is good, -1 lower is good, 0 neutral]
const GROUPS = [
  ["المبيعات", [
    ["المبيعات المباشرة", w => w.sales, f0, 1], ["الطلبات", w => w.orders, f0, 1], ["الطلبات المسعّرة", w => w.priced, f0, 1], ["متوسط الطلب", w => w.avg, f1, 1]]],
  ["القنوات", [
    ["المحل والاتصال", w => w.ch.shop + w.ch.call, f0, 0], ["واتساب", w => w.ch.wa, f0, 1], ["الموقع", w => w.ch.web, f0, 1],
    ["حصة الواتساب", w => w.share && w.share.wa, pc, 1], ["حصة الموقع", w => w.share && w.share.web, pc, 1]]],
  ["التطبيقات (من بواباتها، خارج المبيعات المباشرة)", [
    ["هنقرستيشن", w => w.hunger ? w.hunger.sales : null, f0, 0], ["طلبات هنقرستيشن", w => w.hunger ? w.hunger.orders : null, f0, 0],
    ["ذا شفز", w => w.chefzPortal ? w.chefzPortal.sales : null, f0, 0], ["طلبات ذا شفز", w => w.chefzPortal ? w.chefzPortal.orders : null, f0, 0]]],
  ["الجودة والتشغيل", [
    ["طلبات ملغية", w => w.cancelled, f0, -1], ["قيمة الملغي", w => w.cancelledValue, f0, -1], ["المرتجع", w => w.returns, f0, -1],
    ["الهدر بالتكلفة", w => w.waste, f0, -1], ["متوسط التحضير (دقيقة)", w => w.prep, f0, -1],
    ["تأخير خروج للمندوب", w => w.lateOut, f0, -1], ["تأخير التحضير", w => w.latePrep, f0, -1]]],
  ["العملاء", [["عملاء جدد", w => w.newCust, f0, 1], ["عملاء متكررون", w => w.retCust, f0, 1]]],
];

function chg(now, before, dir){
  if (now == null || before == null) return `<span class="chg flat">—</span>`;
  if (before === 0) return now === 0 ? `<span class="chg flat">0</span>` : `<span class="chg ${dir ? (dir > 0 ? "good" : "bad") : "flat"}">جديد</span>`;
  const p = (now - before) / Math.abs(before) * 100, a = Math.abs(p) < 1;
  const cls = a || !dir ? "flat" : (p > 0) === (dir > 0) ? "good" : "bad";
  return `<span class="chg ${cls}">${a ? "0%" : (p > 0 ? "▲ " : "▼ ") + Math.abs(p).toFixed(0) + "%"}</span>`;
}

function render(x){
  $("upd").textContent = "آخر تحديث " + new Date(x.at).toLocaleString("ar-SA-u-nu-latn-ca-gregory",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short",timeZone:"Asia/Riyadh"});
  const a = x.last, b = x.before;
  $("cmpNote").innerHTML = a && b ? `آخر أسبوع كامل (من ${rng(a.from, a.to)}) مقابل اللي قبله (من ${rng(b.from, b.to)}). الأخضر تحسّن والأحمر تراجع.`
    : a ? `أسبوع كامل واحد بس (من ${rng(a.from, a.to)})؛ المقارنة تبدأ لما يكتمل الأسبوع الثاني.` : "ما فيه أسبوع كامل للحين.";
  $("groups").innerHTML = !a ? "" : GROUPS.map(([g, ms]) => `<div class="group"><h3>${g}</h3><div class="cards">` + ms.map(([k, get, fm, dir]) => {
    const v = get(a), pv = b ? get(b) : null;
    return `<div class="card"><div class="k">${k}</div><div class="v">${fm(v)}</div><div class="row"><span>قبل: <span class="num">${b ? fm(pv) : "—"}</span></span>${b ? chg(v, pv, dir) : ""}</div></div>`;
  }).join("") + `</div></div>`).join("") + (x.appsRead ? "" : `<p class="note">ما قدرت أقرأ «مبيعات_التطبيقات» من الشيت الحين.</p>`);
  const cols = [["الأسبوع", w => rng(w.from, w.to) + (w.partial ? ` <span class="tag">ناقص</span>` : ""), 0],
    ["المبيعات", w => f0(w.sales)], ["الطلبات", w => f0(w.orders)], ["مسعّرة", w => f0(w.priced)], ["المتوسط", w => f1(w.avg)],
    ["واتساب", w => pc(w.share && w.share.wa)], ["الموقع", w => pc(w.share && w.share.web)],
    ["هنقرستيشن", w => w.hunger ? f0(w.hunger.sales) : "—"], ["ذا شفز", w => w.chefzPortal ? f0(w.chefzPortal.sales) : "—"],
    ["ملغي", w => f0(w.cancelled)], ["هدر", w => f0(w.waste)], ["تحضير", w => w.prep == null ? "—" : w.prep],
    ["تأخير مندوب", w => f0(w.lateOut)], ["تأخير تحضير", w => f0(w.latePrep)], ["جدد", w => f0(w.newCust)], ["متكررون", w => f0(w.retCust)]];
  $("weeks").innerHTML = `<thead><tr>${cols.map(c => `<th scope="col">${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    x.weeks.map(w => `<tr class="${w.partial ? "part" : ""}" title="${w.partial ? esc(w.partial) : ""}">${cols.map((c, i) => `<td class="${i ? "n" : ""}">${c[1](w)}</td>`).join("")}</tr>`).join("") + `</tbody>`;
}

async function load(){
  if (!code) { $("gate").hidden = false; $("main").hidden = true; return; }
  const r = await fetch("/api/dash/admin", { headers: { "x-dash-code": code }, cache: "no-store" }).catch(() => null);
  if (!r) { $("err").textContent = "ما قدرت أوصل للسيرفر"; $("gate").hidden = false; return; }
  if (!r.ok) { const j = await r.json().catch(() => ({})); try { sessionStorage.removeItem(KEY); } catch {} code = ""; $("err").textContent = j.error || "خطأ " + r.status; $("gate").hidden = false; $("main").hidden = true; return; }
  $("gate").hidden = true; $("main").hidden = false;
  render(await r.json());
}
$("gf").addEventListener("submit", e => { e.preventDefault(); code = $("code").value.trim(); try { sessionStorage.setItem(KEY, code); } catch {} $("err").textContent = ""; load(); });
// big screens (Hassan's TV, 2026-11-17: «كأنه مخصص لهاتف… الخطوط صغيرة»): the same layout scaled to fill the width
function fit(){ const w = innerWidth, z = w > 1300 ? Math.min(2.6, (w - 40) / 1140) : 1; document.documentElement.style.zoom = z; }
addEventListener("resize", fit); fit();
load();
</script>
</body>
</html>
